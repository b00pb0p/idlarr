name: publish

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE }}
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}

      - name: Build amd64 image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: idlarr:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Smoke test 1: with env vars (backward compat) --------------------
      - name: "Smoke test: boot with explicit env vars"
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke/data /tmp/smoke/config
          cp trackers.example.yml /tmp/smoke/config/trackers.yml
          sudo chown -R 1001 /tmp/smoke/data /tmp/smoke/config
          docker run -d --name smoke -p 8099:8080 \
            -e IDLARR_TOKEN=smoke-token \
            -e IDLARR_NOTIFY_URLS=json://localhost/ \
            -v /tmp/smoke/data:/data \
            -v /tmp/smoke/config:/config \
            idlarr:smoke

          ok=
          for _ in $(seq 1 30); do
            if curl -fsS localhost:8099/healthz -o /tmp/smoke/healthz.json; then ok=1; break; fi
            sleep 2
          done
          docker logs smoke
          if [ -z "$ok" ]; then echo "::error::container never answered /healthz"; exit 1; fi
          cat /tmp/smoke/healthz.json; echo

          # Assert trackers were loaded (not zero — the example file has content).
          count=$(python3 -c "import json;print(json.load(open('/tmp/smoke/healthz.json'))['trackers'])")
          if [ "$count" -lt 1 ]; then
            echo "::error::expected at least 1 tracker from trackers.example.yml, got $count"; exit 1
          fi
          echo "smoke1: $count trackers loaded"

          # /ping must fail CLOSED without auth.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8099/ping \
                   -H 'Content-Type: application/json' -d '{"tracker":"alpha"}')
          if [ "$code" != "401" ]; then
            echo "::error::unauthenticated /ping returned $code, expected 401"; exit 1
          fi
          echo "smoke1: unauthenticated /ping correctly 401"
          docker rm -f smoke

      # ---- Smoke test 2: zero-config boot (new behavior) --------------------
      - name: "Smoke test: zero-config boot (no env vars, no config file)"
        run: |
          set -euo pipefail
          mkdir -p /tmp/smoke2/data /tmp/smoke2/config
          sudo chown -R 1001 /tmp/smoke2/data /tmp/smoke2/config
          # No IDLARR_TOKEN, no IDLARR_NOTIFY_URLS, no trackers.yml
          docker run -d --name smoke2 -p 8098:8080 \
            -v /tmp/smoke2/data:/data \
            -v /tmp/smoke2/config:/config \
            idlarr:smoke

          ok=
          for _ in $(seq 1 30); do
            if curl -fsS localhost:8098/healthz -o /tmp/smoke2/healthz.json; then ok=1; break; fi
            sleep 2
          done
          docker logs smoke2
          if [ -z "$ok" ]; then echo "::error::zero-config container never answered /healthz"; exit 1; fi
          cat /tmp/smoke2/healthz.json; echo

          # Should boot with 0 trackers (auto-generated empty config).
          count=$(python3 -c "import json;print(json.load(open('/tmp/smoke2/healthz.json'))['trackers'])")
          echo "smoke2: zero-config boot OK, $count trackers"

          # Token should have been auto-generated — /ping without it should 401.
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8098/ping \
                   -H 'Content-Type: application/json' -d '{"tracker":"test"}')
          if [ "$code" != "401" ]; then
            echo "::error::zero-config /ping returned $code, expected 401 (token should be required)"; exit 1
          fi
          echo "smoke2: auto-generated token enforced on /ping"

          # trackers.yml should have been auto-created.
          if [ ! -f /tmp/smoke2/config/trackers.yml ]; then
            echo "::error::trackers.yml was not auto-created"; exit 1
          fi
          echo "smoke2: trackers.yml auto-created"
          docker rm -f smoke2

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
