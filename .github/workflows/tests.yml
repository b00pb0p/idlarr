name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Kickable by hand from the Actions tab. During the 2026-08-06 Actions
  # incident GitHub throttled webhooks to ~15%, so pushes stopped creating runs
  # at all: there was no failed run to retry, and re-pushing was a coin flip.
  # publish.yml already had this; this one could not be started by any means.
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    # The suite runs in about 15 seconds. Anything approaching this is a
    # hung step, not a slow one, and without a cap it burns runner time up
    # to GitHub's 6 hour default before reporting anything useful.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # httpx2 is what fastapi's TestClient runs on. It arrives transitively
          # today, but test_auth.py would break on an unrelated dependency bump
          # if we relied on that, so name it. Starlette deprecated plain `httpx`
          # here in the 0.52 uvicorn/fastapi bump; it still works, but a future
          # release drops it and the suite would fail at import.
          pip install -r requirements.txt pytest httpx2
      - name: Run tests
        run: python -m pytest -q
      - name: Check the config example and userscript still parse
        run: |
          python -c "import yaml; d=yaml.safe_load(open('trackers.example.yml')); print(len(d['trackers']), 'example trackers')"
          python -c "import ast; ast.parse(open('app.py').read()); print('app.py OK')"
