name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # httpx is what fastapi's TestClient runs on. It arrives transitively
          # today, but test_auth.py would break on an unrelated dependency bump
          # if we relied on that, so name it.
          pip install -r requirements.txt pytest httpx
      - name: Run tests
        run: python -m pytest -q
      - name: Check the config example and userscript still parse
        run: |
          python -c "import yaml; d=yaml.safe_load(open('trackers.example.yml')); print(len(d['trackers']), 'example trackers')"
          python -c "import ast; ast.parse(open('app.py').read()); print('app.py OK')"
