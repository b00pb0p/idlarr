services:
  idlarr:
    build: .
    container_name: idlarr
    restart: unless-stopped
    ports:
      - "8099:8080"
    volumes:
      - ./data:/data
      - ./config:/config
    environment:
      TZ: "${TZ:-UTC}"
      # All other settings are auto-generated on first boot and configurable
      # from the web UI. Set env vars here only to override/pin a value:
      #
      # IDLARR_TOKEN: ""          # auto-generated if empty
      # IDLARR_NOTIFY_URLS: ""    # configure in Settings > Notifications
      # STATUS_URL: ""            # configure in Settings > General
      # IDLARR_RESET_AUTH: ""     # set to "1" to clear a forgotten password
