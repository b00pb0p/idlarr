services:
  idlarr:
    build: .
    container_name: idlarr
    restart: unless-stopped
    ports:
      - "8099:8080"
    volumes:
      # Pre-create both on the host and chown them to 1001. If Docker
      # creates them they come out root-owned and the container cannot write
      # its database — startup fails with "unable to open database file".
      - ./data:/data
      - ./config:/config
    environment:
      # --- secrets: set these in a .env file beside this compose file --------
      # IDLARR_TOKEN is OPTIONAL. Leave it empty and the service generates one
      # on first boot and stores it in the database — the generated userscript
      # then carries the right value automatically. Set it only if you want a
      # specific token; an explicit value always wins over the generated one.
      #
      # This used `${VAR:?msg}` to abort when it was empty, because an empty
      # token once disabled auth entirely. That hole is still closed — /ping
      # refuses to serve when no token can be obtained — but by guaranteeing a
      # token exists rather than by refusing to start.
      IDLARR_TOKEN: "${IDLARR_TOKEN:-}"

      # --- where your notifications go --------------------------------------
      # Comma-separated Apprise URLs. ntfy, Pushover, Discord, Telegram,
      # Signal, and ~100 more all go through here.
      #
      # Also optional, so a first run can boot and be looked at before you wire
      # up a push service. Compose used to abort without it, which was stricter
      # than the service itself — the app warns loudly at startup instead, and
      # the Notifications panel shows the count. Do set it: a watchdog that
      # cannot reach you is the exact failure this project exists to avoid.
      IDLARR_NOTIFY_URLS: "${IDLARR_NOTIFY_URLS:-}"

      # --- appended to every alert so you can tap through to the page -------
      STATUS_URL: "${STATUS_URL:-}"

      # --- non-secret settings ----------------------------------------------
      TZ: "${TZ:-UTC}"
      # Emergency door for a forgotten UI password. Set it to 1 in .env, start
      # once, then REMOVE it -- while it is set, every boot clears the login.
      # The password itself is not here: it is set from the status page and
      # stored hashed in the database.
      IDLARR_RESET_AUTH: "${IDLARR_RESET_AUTH:-}"
      # PUID is NOT here on purpose: it is a build argument, baked into the
      # image. Setting it at runtime does nothing. chown data/ and config/ to
      # 1001, or build from source with --build-arg PUID=<uid>.
