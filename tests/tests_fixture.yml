# Idlarr config. Hot-reloaded — no container restart needed.
#
#   inactivity_days : how many days of no login this tracker tolerates before
#                     it prunes the account, IN DAYS.
#   verified        : set true ONLY after you have read that tracker's own
#                     rules page and confirmed the number. Unverified rows are
#                     marked with a "?" on the status page.
#   immune          : true if this account cannot be pruned at all — donation,
#                     a high enough user class, a standing exemption. An immune
#                     tracker keeps its row but never alerts and never counts
#                     toward the unconfirmed-limits total.
#   immune_reason   : free text, why. Write it down; you will not remember in
#                     six months whether it was the donation or the class.
#
# All four are editable straight from the status page — no need to open this
# file. Edits here are hot-reloaded either way.
#
# ############################################################################
# # EVERY inactivity_days BELOW IS A FAIL-SAFE PLACEHOLDER, NOT A FACT.     #
# # I do not know these trackers' real policies. 30d is short enough to nag  #
# # you before almost any real limit is hit. Correct each one upward as you  #
# # confirm it, and flip verified: true.                                     #
# ############################################################################
#
# Also worth recording per tracker, in notes:
#   - whether seeding announces reset the clock (many count them; then you
#     may not need an entry at all)
#   - whether your user class is exempt from inactivity pruning (common on
#     Gazelle sites above a certain rank)
#   - whether the site has a vacation/hiatus mode you should use instead

defaults:
  inactivity_days: 30
  alert_at_pct: 0.65
  timezone: America/Chicago
  check_hour: 9

trackers:
  # Replace these with your own. `id` must match the SITES entry in
  # idlarr.user.js, or /ping answers 404 and nothing is ever recorded.
  - id: alpha
    name: Alpha Tracker
    url: https://alpha.example/
    inactivity_days: 30
    verified: false
    notes: "Gazelle"

  - id: beta
    name: Beta Tracker
    url: https://beta.example/index.php
    inactivity_days: 30
    verified: false
    notes: "Gazelle"

  - id: gamma
    name: Gamma Tracker
    url: https://gamma.example/index.php
    inactivity_days: 30
    verified: false
    notes: "Gazelle. Already lost this one once."

  - id: delta
    name: Delta Tracker
    url: https://delta.example/
    inactivity_days: 30
    verified: false
    notes: "Custom. Has vacation mode - use it."

  - id: epsilon
    name: Epsilon Tracker
    url: https://epsilon.example/browse.php
    inactivity_days: 30
    verified: false
    notes: "TBDev"

  - id: zeta
    name: Zeta Tracker
    url: https://zeta.example/browse
    inactivity_days: 30
    verified: false
    notes: "Custom"
    # A site whose logout control is not in the DOM at all (an SPA that renders
    # its user menu only on click) needs an explicit selector. Point auth_sel at
    # anything that exists ONLY when authenticated. It goes straight into the
    # generated userscript's SITES entry.
    auth_sel: 'a[href*="/torrent?key="]'

  - id: omega
    name: Omega Tracker
    url: https://omega.example/
    # `host` is derived from `url` (minus any leading www.) and drives the
    # generated userscript's @match line. Set it explicitly only when the site
    # you log in on differs from the URL you want the row to link to.
    host: omega.example
    inactivity_days: 30
    verified: false
    notes: "UNIT3D. Confirm the domain periodically."
